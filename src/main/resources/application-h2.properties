# Perfil H2 (Sprint 1): base en archivo dentro de ./data
spring.datasource.url=jdbc:h2:file:./data/ultimafila;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2: http://localhost:8093/h2-console (JDBC URL igual a la de arriba)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Se recrea el esquema y se cargan los datos semilla en cada arranque
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always

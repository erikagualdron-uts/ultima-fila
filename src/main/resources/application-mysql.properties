# Perfil MySQL (Sprint 2). Las credenciales van en variables de entorno, nunca aqui.
# En Eclipse: Run Configurations > Environment, o SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ultimafila}?createDatabaseIfNotExist=true&serverTimezone=America/Bogota&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# SSL: local DISABLED (por defecto); en Aiven DB_SSL_MODE=REQUIRED

# Primera ejecucion: DDL_AUTO=create y DB_INIT=always para crear tablas y cargar data.sql.
# Despues: valores por defecto (update y never) para conservar los datos.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.sql.init.mode=${DB_INIT:never}

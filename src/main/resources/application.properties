spring.application.name=ultimafila
server.port=8093

# Perfil por defecto: h2. Para MySQL ejecutar con el perfil mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Thymeleaf sin caché durante el desarrollo (DevTools)
spring.thymeleaf.cache=false

# JPA comun
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql se ejecuta despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true

# Errores: nunca mostrar la traza al usuario
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

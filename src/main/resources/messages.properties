# Mensajes de validación en español (Spring Boot lee messages.properties en UTF-8 por defecto).
# Se usan cuando un campo numérico llega vacío o con texto: sin ellos la pantalla mostraría el
# texto técnico en inglés «Failed to convert property value of type 'java.lang.String'...».

# Por campo: formulario de película (P-12) y de sala (P-13)
typeMismatch.pelicula.duracionMin=Indica la duración en minutos (número entero)
typeMismatch.sala.filas=Indica las filas (número entero de 1 a 26)
typeMismatch.sala.sillasPorFila=Indica las sillas por fila (número entero de 1 a 30)

# Respaldo para cualquier otro campo numérico
typeMismatch.int=Indica un número entero
typeMismatch=El valor no es válido

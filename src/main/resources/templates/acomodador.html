<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Control de ingreso')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container py-4">
  <h1 class="h2">Control de ingreso</h1>
  <p class="text-suave">Se permite el ingreso desde 30 minutos antes del inicio hasta el fin de la función.</p>

  <div class="row">
    <div class="col-12 col-md-8 col-lg-6">
      <form class="compra" th:action="@{/acomodador/validar}" method="post">
        <label class="form-label" for="codigo">Código de la boleta</label>
        <div class="d-flex flex-column flex-sm-row gap-2">
          <input class="form-control" type="text" id="codigo" name="codigo" maxlength="30" required
                 autofocus autocomplete="off" placeholder="B-ABC12345">
          <button class="btn btn-uf" type="submit">Validar</button>
        </div>
      </form>

      <div class="mt-3" aria-live="polite">
        <div class="resultado-ingreso valido" th:if="${resultado != null and valida}">
          <strong><span aria-hidden="true">✓ </span>Ingreso permitido</strong><br>
          <span class="resultado-detalle" th:text="${resultado}">Sala 1, silla D7</span>
        </div>
        <div class="resultado-ingreso rechazado" th:if="${resultado != null and !valida}">
          <strong><span aria-hidden="true">✕ </span><span th:text="${resultado}">No se pudo validar la boleta</span></strong>
        </div>
      </div>
    </div>
  </div>

  <section class="mt-4" aria-labelledby="titulo-funciones">
    <h2 class="h4" id="titulo-funciones">Funciones de hoy</h2>
    <div class="compra">
      <p th:if="${funcionesHoy.isEmpty()}" class="text-suave mb-0">Hoy no hay funciones programadas.</p>
      <ul class="list-unstyled mb-0">
        <li class="fila-boleta" th:each="f, i : ${funcionesHoy}" th:classappend="${i.first} ? 'border-0 pt-0'">
          <span class="fila-boleta-silla" th:text="${#temporals.format(f.fechaHoraInicio, 'HH:mm')}">18:30</span>
          <span class="fila-boleta-detalle">
            <strong th:text="${f.pelicula.titulo}">Película</strong><br>
            <span class="text-suave" th:text="${f.sala.nombre}">Sala 1</span>
          </span>
          <span class="fila-boleta-codigo">
            <a class="btn btn-sm btn-outline-uf" th:href="@{/acomodador/funciones/{id}(id=${f.id})}"
               th:aria-label="'Ver ocupación de ' + ${f.pelicula.titulo} + ' a las ' + ${#temporals.format(f.fechaHoraInicio, 'HH:mm')}">Ver ocupación</a>
          </span>
        </li>
      </ul>
    </div>
  </section>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Programar función')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container py-4">
  <nav th:replace="~{fragmentos/layout :: menuAdmin('funciones')}"></nav>
  <div class="row justify-content-center">
    <div class="col-12 col-lg-6">
      <h1>Programar función</h1>

      <form class="card card-uf p-3" th:action="@{/admin/funciones}" th:object="${funcionForm}" method="post" novalidate>
        <div class="alerta-uf" role="alert" th:if="${#fields.hasGlobalErrors()}">
          <span th:each="e : ${#fields.globalErrors()}" th:text="${e}"></span>
        </div>
        <div class="mb-3">
          <label for="idPelicula" class="form-label">Película</label>
          <select class="form-select" id="idPelicula" th:field="*{idPelicula}"
                  th:classappend="${#fields.hasErrors('idPelicula')} ? 'is-invalid'">
            <option value="">Elige una película</option>
            <option th:each="p : ${peliculas}" th:value="${p.id}" th:attr="data-duracion=${p.duracionMin}"
                    th:text="${p.titulo + ' (' + p.duracionMin + ' min)'}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{idPelicula}"></div>
        </div>
        <div class="mb-3">
          <label for="idSala" class="form-label">Sala</label>
          <select class="form-select" id="idSala" th:field="*{idSala}"
                  th:classappend="${#fields.hasErrors('idSala')} ? 'is-invalid'">
            <option value="">Elige una sala</option>
            <option th:each="s : ${salas}" th:value="${s.id}" th:text="${s.nombre}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{idSala}"></div>
        </div>
        <div class="row">
          <div class="col-12 col-sm-6 mb-3">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fecha" th:field="*{fecha}"
                   th:classappend="${#fields.hasErrors('fecha')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{fecha}"></div>
          </div>
          <div class="col-12 col-sm-6 mb-3">
            <label for="hora" class="form-label">Hora</label>
            <input type="time" class="form-control" id="hora" th:field="*{hora}"
                   th:classappend="${#fields.hasErrors('hora')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{hora}"></div>
          </div>
        </div>
        <p class="fw-semibold" id="finEstimado" aria-live="polite"></p>
        <div class="mb-3">
          <label for="precio" class="form-label">Precio por silla ($)</label>
          <input type="number" class="form-control" id="precio" th:field="*{precio}" min="0" step="500"
                 th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'" aria-describedby="ayudaFin">
          <div class="form-text" id="ayudaFin">La función termina al acabar la película más 15 minutos.</div>
          <div class="invalid-feedback" th:errors="*{precio}"></div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-uf">Guardar</button>
          <a class="btn btn-outline-uf" th:href="@{/admin/funciones}">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>

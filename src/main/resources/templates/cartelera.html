<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Cartelera')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container py-4">
  <h1>En cartelera</h1>

  <form class="row g-2 align-items-end mt-2" th:action="@{/cartelera}" method="get" role="search">
    <input type="hidden" name="fecha" th:value="${fecha}" th:disabled="${fecha == null}">
    <div class="col-12 col-md-5">
      <label for="q" class="form-label">Buscar por título</label>
      <input type="search" class="form-control" id="q" name="q" th:value="${q}" maxlength="100">
    </div>
    <div class="col-12 col-sm-6 col-md-4">
      <label for="genero" class="form-label">Género</label>
      <select class="form-select" id="genero" name="genero">
        <option value="">Todos</option>
        <option th:each="g : ${generos}" th:value="${g.id}" th:text="${g.nombre}"
                th:selected="${genero != null and genero == g.id}">Género</option>
      </select>
    </div>
    <div class="col-12 col-sm-6 col-md-3 d-flex gap-2">
      <button type="submit" class="btn btn-uf flex-fill">Filtrar</button>
      <a class="btn btn-outline-uf" th:href="@{/cartelera}">Limpiar</a>
    </div>
  </form>

  <nav class="tira-fechas mt-3" aria-label="Filtrar por fecha">
    <a class="chip-fecha" th:classappend="${fecha == null} ? 'activo'" th:attr="aria-current=${fecha == null} ? 'true'"
       th:href="@{/cartelera(q=${q},genero=${genero})}">Todas</a>
    <a class="chip-fecha" th:classappend="${fecha != null and fecha == hoy} ? 'activo'" th:attr="aria-current=${fecha != null and fecha == hoy} ? 'true'"
       th:href="@{/cartelera(q=${q},genero=${genero},fecha=${hoy})}">Hoy</a>
    <a class="chip-fecha" th:classappend="${fecha != null and fecha == hoy.plusDays(1)} ? 'activo'" th:attr="aria-current=${fecha != null and fecha == hoy.plusDays(1)} ? 'true'"
       th:href="@{/cartelera(q=${q},genero=${genero},fecha=${hoy.plusDays(1)})}">Mañana</a>
    <div class="calendario-uf" id="calendario" th:attr="data-dias=${#strings.listJoin(dias, ',')},data-hoy=${hoy},data-fecha=${fecha}">
      <button type="button" class="chip-fecha chip-calendario" id="btn-calendario" aria-haspopup="dialog" aria-expanded="false" aria-controls="panel-calendario"
              th:with="otra=${fecha != null and fecha != hoy and fecha != hoy.plusDays(1)}" th:classappend="${otra} ? 'activo'">
        <span th:text="${otra} ? ${#temporals.format(fecha, 'd MMM', new java.util.Locale('es', 'CO'))} : 'Elegir fecha'">Elegir fecha</span>
      </button>
      <div class="panel-calendario" id="panel-calendario" role="dialog" aria-label="Elegir fecha" hidden></div>
    </div>
  </nav>

  <div id="resultados" aria-live="polite">
    <div class="vacio-uf" th:if="${peliculas.empty}">
      <!-- Icono «film» de Bootstrap Icons (MIT), en línea: sin dependencias nuevas -->
      <svg class="icono-vacio" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M0 1a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1zm4 0v6h8V1zm8 8H4v6h8zM1 1v2h2V1zm2 3H1v2h2zM1 7v2h2V7zm2 3H1v2h2zm-2 3v2h2v-2zM15 1h-2v2h2zm-2 3v2h2V4zm2 3h-2v2h2zm-2 3v2h2v-2zm2 3h-2v2h2z"/>
      </svg>
      <p class="mb-0">No se encontraron películas.</p>
    </div>

    <div class="row g-3 g-md-4 mt-1" th:unless="${peliculas.empty}">
      <div class="col-6 col-md-4 col-lg-3" th:each="p, fila : ${peliculas.content}">
        <article th:replace="~{fragmentos/layout :: tarjetaPeli(${p}, ${fila.index}, 2)}"></article>
      </div>
    </div>
  </div>

  <nav class="mt-4" aria-label="Paginación de la cartelera" th:if="${peliculas.totalPages > 1}">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:classappend="${peliculas.first} ? 'disabled'">
        <a class="page-link" th:href="@{/cartelera(pagina=${peliculas.number},q=${q},genero=${genero},fecha=${fecha})}">Anterior</a>
      </li>
      <li class="page-item" th:each="n : ${#numbers.sequence(1, peliculas.totalPages)}"
          th:classappend="${n == peliculas.number + 1} ? 'active'">
        <a class="page-link" th:href="@{/cartelera(pagina=${n},q=${q},genero=${genero},fecha=${fecha})}" th:text="${n}"
           th:attr="aria-current=${n == peliculas.number + 1} ? 'page'">1</a>
      </li>
      <li class="page-item" th:classappend="${peliculas.last} ? 'disabled'">
        <a class="page-link" th:href="@{/cartelera(pagina=${peliculas.number + 2},q=${q},genero=${genero},fecha=${fecha})}">Siguiente</a>
      </li>
    </ul>
  </nav>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
<script th:src="@{/js/cartelera.js}"></script>
<script th:src="@{/js/calendario.js}"></script>
</body>
</html>

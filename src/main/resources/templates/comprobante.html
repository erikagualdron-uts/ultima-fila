<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Comprobante de compra')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container py-4">
  <h1 class="h2">Comprobante de compra</h1>
  <p class="text-suave">Código de compra: <strong th:text="${compra.codigo}">C-ABC12345</strong></p>

  <div class="resumen-sillas p-3 mb-3">
    <h2 class="h5" th:text="${funcion.pelicula.titulo}">Película</h2>
    <p class="text-suave mb-2">
      <span th:text="${funcion.sala.nombre}">Sala 1</span> ·
      <span th:text="${#temporals.format(funcion.fechaHoraInicio, 'dd/MM/yyyy HH:mm')}">01/12/2026 18:30</span>
    </p>
    <p class="mb-0">
      Estado: <span class="badge text-bg-success" th:text="${compra.estado}">PAGADA</span> ·
      Total: <strong class="precio" th:text="${'$ ' + #numbers.formatDecimal(compra.total, 1, 'POINT', 0, 'COMMA')}">$ 24.000</strong>
    </p>
  </div>

  <div class="table-responsive">
    <table class="table align-middle">
      <caption class="visually-hidden">Boletas de la compra</caption>
      <thead>
        <tr><th scope="col">Silla</th><th scope="col">Código de boleta</th><th scope="col">Estado</th></tr>
      </thead>
      <tbody>
        <tr th:each="boleta : ${boletas}">
          <td th:text="${boleta.silla.fila + boleta.silla.numero}">A1</td>
          <td><code th:text="${boleta.codigo}">B-ABC12345</code></td>
          <td><span class="badge text-bg-secondary" th:text="${boleta.estado}">VENDIDA</span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <button type="button" class="btn btn-uf" onclick="window.print()">Imprimir</button>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>

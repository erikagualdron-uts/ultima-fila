<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${titulo ?: 'Error'})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container py-5 text-center">
  <!-- Icono «ticket-perforated» de Bootstrap Icons (MIT), en línea: sin dependencias nuevas -->
  <svg class="icono-error" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
    <path d="M4 4.85v.9h1v-.9zm7 0v.9h1v-.9zm-7 1.8v.9h1v-.9zm7 0v.9h1v-.9zm-7 1.8v.9h1v-.9zm7 0v.9h1v-.9zm-7 1.8v.9h1v-.9zm7 0v.9h1v-.9z"/>
    <path d="M1.5 3A1.5 1.5 0 0 0 0 4.5V6a.5.5 0 0 0 .5.5 1.5 1.5 0 1 1 0 3 .5.5 0 0 0-.5.5v1.5A1.5 1.5 0 0 0 1.5 13h13a1.5 1.5 0 0 0 1.5-1.5V10a.5.5 0 0 0-.5-.5 1.5 1.5 0 0 1 0-3A.5.5 0 0 0 16 6V4.5A1.5 1.5 0 0 0 14.5 3zM1 4.5a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 .5.5v1.05a2.5 2.5 0 0 0 0 4.9v1.05a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-1.05a2.5 2.5 0 0 0 0-4.9z"/>
  </svg>
  <p class="silla-vacia" th:if="${(codigo ?: status) == 404}">Esta boleta no lleva a ninguna función</p>
  <p class="display-1 mb-0 codigo-error" th:text="${codigo ?: status ?: 'Error'}">404</p>
  <h1 class="h2" th:text="${titulo ?: 'Algo salió mal'}">Página no encontrada</h1>
  <p class="text-suave mb-4" th:text="${detalle ?: 'Ocurrió un problema. Puedes volver al inicio e intentar de nuevo.'}">Mensaje</p>
  <a class="btn btn-uf btn-lg" th:href="@{/}">Volver al inicio</a>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · Última Fila'">Última Fila</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/ultimafila.css}">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-uf" aria-label="Navegación principal">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Última Fila</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Cartelera</a></li>
        <li class="nav-item" th:if="${session.rol?.name() == 'ADMINISTRADOR'}"><a class="nav-link" th:href="@{/admin}">Administración</a></li>
        <li class="nav-item" th:if="${session.rol?.name() == 'TAQUILLERO'}"><a class="nav-link" th:href="@{/taquilla}">Taquilla</a></li>
        <li class="nav-item" th:if="${session.rol?.name() == 'ACOMODADOR'}"><a class="nav-link" th:href="@{/acomodador}">Control de ingreso</a></li>
        <li class="nav-item" th:if="${session.rol?.name() == 'CLIENTE'}"><a class="nav-link" th:href="@{/mis-boletas}">Mis boletas</a></li>
        <li class="nav-item" th:if="${session.rol == null}"><a class="nav-link" th:href="@{/login}">Iniciar sesión</a></li>
        <li class="nav-item" th:if="${session.rol == null}"><a class="nav-link" th:href="@{/registro}">Registrarse</a></li>
        <li class="nav-item" th:if="${session.rol != null}">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="nav-link btn btn-link">Salir</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div th:fragment="alertas" class="alertas-uf" aria-live="polite">
  <div class="aviso-uf" role="status" th:if="${mensaje != null}" th:text="${mensaje}"></div>
  <div class="aviso-uf error" role="alert" th:if="${error != null}" th:text="${error}"></div>
</div>

<footer th:fragment="footer" class="footer-uf">
  <div class="container text-center">
    <p class="mb-1">Cine Comunitario Luz de Barrio · Última Fila</p>
    <p class="mb-0 small">Proyecto académico UTS · Programación en Java</p>
  </div>
</footer>

<th:block th:fragment="scripts">
  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/ultimafila.js}"></script>
</th:block>

</body>
</html>

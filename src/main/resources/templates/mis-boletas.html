<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Mis boletas')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container py-4">
  <h1 class="h2">Mis boletas</h1>

  <p th:if="${compras.isEmpty()}" class="text-suave">
    Aún no tienes compras. <a th:href="@{/}">Mira la cartelera</a> y elige tu función.
  </p>

  <section th:each="entrada : ${compras}" class="mb-4" th:aria-label="'Compra ' + ${entrada.key.codigo}">
    <h2 class="h5 mb-1">
      <a th:href="@{/compras/{codigo}(codigo=${entrada.key.codigo})}" th:text="${entrada.key.codigo}">C-ABC12345</a>
      <span class="badge insignia-estado ms-2" th:classappend="'estado-' + ${#strings.toLowerCase(entrada.key.estado)}"
            th:text="${#strings.capitalize(#strings.toLowerCase(entrada.key.estado))}">Pagada</span>
    </h2>
    <p class="text-suave mb-2">
      <span th:text="${#temporals.format(entrada.key.fechaCompra, 'dd/MM/yyyy HH:mm')}">24/11/2026 10:00</span> ·
      Total <strong class="precio" th:text="${'$ ' + #numbers.formatDecimal(entrada.key.total, 1, 'POINT', 0, 'COMMA')}">$ 24.000</strong>
    </p>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr><th scope="col">Película</th><th scope="col">Sala</th><th scope="col">Función</th>
              <th scope="col">Silla</th><th scope="col">Código</th><th scope="col">Estado</th></tr>
        </thead>
        <tbody>
          <tr th:each="boleta : ${entrada.value}">
            <td th:text="${boleta.funcion.pelicula.titulo}">Película</td>
            <td th:text="${boleta.funcion.sala.nombre}">Sala 1</td>
            <td th:text="${#temporals.format(boleta.funcion.fechaHoraInicio, 'dd/MM/yyyy HH:mm')}">01/12/2026 18:30</td>
            <td th:text="${boleta.silla.fila + boleta.silla.numero}">A1</td>
            <td><code th:text="${boleta.codigo}">B-ABC12345</code></td>
            <td><span class="badge insignia-estado" th:classappend="'estado-' + ${#strings.toLowerCase(boleta.estado)}"
                      th:text="${#strings.capitalize(#strings.toLowerCase(boleta.estado))}">Vendida</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>

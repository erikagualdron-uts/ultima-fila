<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${pelicula.titulo})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container py-4">
  <a th:href="@{/cartelera}">&larr; Volver a la cartelera</a>

  <div class="row g-4 mt-1">
    <div class="col-12 col-md-4 col-lg-3">
      <div class="afiche-detalle rounded overflow-hidden">
        <img th:if="${pelicula.posterUrl != null and !pelicula.posterUrl.isBlank()}" th:src="${pelicula.posterUrl}"
             th:alt="'Afiche de ' + ${pelicula.titulo}" th:attr="data-titulo=${pelicula.titulo}">
        <div th:unless="${pelicula.posterUrl != null and !pelicula.posterUrl.isBlank()}" class="afiche-respaldo"
             role="img" th:aria-label="'Afiche de ' + ${pelicula.titulo}" th:text="${pelicula.titulo}"></div>
      </div>
    </div>
    <div class="col-12 col-md-8 col-lg-9">
      <h1 th:text="${pelicula.titulo}">Título</h1>
      <p class="text-suave mb-2">
        <span th:text="${pelicula.genero.nombre}">Género</span> ·
        <span th:text="${pelicula.duracionMin} + ' min'">100 min</span>
        <span class="badge badge-uf ms-1" th:text="${pelicula.clasificacion.name().replace('_', ' ')}">TODO PUBLICO</span>
      </p>
      <p class="sinopsis" th:text="${pelicula.sinopsis}">Sinopsis</p>
    </div>
  </div>

  <section class="mt-4" aria-labelledby="titulo-funciones">
    <h2 id="titulo-funciones">Funciones</h2>
    <p class="text-suave" th:if="${funciones.empty}">Esta película no tiene funciones programadas por ahora.</p>
    <div class="table-responsive" th:unless="${funciones.empty}">
      <table class="table align-middle">
        <thead>
          <tr>
            <th scope="col">Fecha</th><th scope="col">Hora</th><th scope="col">Sala</th>
            <th scope="col">Precio</th><th scope="col">Sillas disponibles</th>
            <th scope="col"><span class="visually-hidden">Elegir</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="f : ${funciones}" th:with="libres=${disponibles.get(f.id)}">
            <td th:text="${#temporals.format(f.fechaHoraInicio, 'dd/MM/yyyy')}">28/11/2026</td>
            <td th:text="${#temporals.format(f.fechaHoraInicio, 'HH:mm')}">18:00</td>
            <td th:text="${f.sala.nombre}">Sala 1</td>
            <td class="precio" th:text="${'$' + #numbers.formatDecimal(f.precio, 1, 'POINT', 0, 'COMMA')}">$12,000</td>
            <td th:text="${libres}">40</td>
            <td>
              <span th:if="${libres <= 0}" class="btn btn-hora agotada" aria-disabled="true">Agotada</span>
              <a th:unless="${libres <= 0}" class="btn btn-hora"
                 th:classappend="${libres <= pocasSillas} ? 'pocas'"
                 th:href="@{/funciones/{id}/sillas(id=${f.id})}">Elegir sillas</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${pelicula.titulo})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container py-4">
  <a th:href="@{/cartelera}">&larr; Volver a la cartelera</a>

  <div th:with="tieneAfiche=${pelicula.posterUrl != null and !pelicula.posterUrl.isBlank()}">
    <section class="detalle-cabecera mt-3" th:if="${tieneAfiche}">
      <div class="afiche-detalle rounded overflow-hidden">
        <img th:src="${pelicula.posterUrl}" th:alt="'Afiche de ' + ${pelicula.titulo}"
             th:attr="data-titulo=${pelicula.titulo},data-genero=${pelicula.genero.nombre}">
      </div>
      <div class="detalle-datos">
        <h1 th:text="${pelicula.titulo}">Título</h1>
        <p class="text-suave mb-0">
          <span th:text="${pelicula.genero.nombre}">Género</span> ·
          <span th:text="${pelicula.duracionMin} + ' min'">100 min</span>
          <span th:replace="~{fragmentos/layout :: clasificacion(${pelicula.clasificacion})}"></span>
        </p>
      </div>
      <p class="sinopsis detalle-sinopsis" th:text="${pelicula.sinopsis}">Sinopsis</p>
    </section>

    <th:block th:unless="${tieneAfiche}">
      <header class="marquesina mt-3">
        <h1 th:text="${pelicula.titulo}">Título</h1>
        <p class="marquesina-meta mb-0">
          <span th:text="${pelicula.genero.nombre}">Género</span> ·
          <span th:text="${pelicula.duracionMin} + ' min'">100 min</span>
          <span th:replace="~{fragmentos/layout :: clasificacion(${pelicula.clasificacion})}"></span>
        </p>
      </header>
      <p class="sinopsis mt-3" th:text="${pelicula.sinopsis}">Sinopsis</p>
    </th:block>
  </div>

  <section class="mt-4" aria-labelledby="titulo-funciones">
    <h2 id="titulo-funciones" class="titulo-seccion">Funciones</h2>
    <p class="text-suave" th:if="${funciones.empty}">Esta película no tiene funciones programadas por ahora.</p>
    <div th:unless="${funciones.empty}">
      <th:block th:each="f, it : ${funciones}" th:with="libres=${disponibles.get(f.id)}">
        <h3 class="dia-funciones"
            th:if="${it.first or f.fechaHoraInicio.toLocalDate() != funciones[it.index - 1].fechaHoraInicio.toLocalDate()}"
            th:text="${#strings.capitalize(#temporals.format(f.fechaHoraInicio, 'EEEE d ''de'' MMMM', new java.util.Locale('es', 'CO')))}">Sábado 28 de noviembre</h3>
        <div class="funcion-fila" th:with="estado=${libres <= 0 ? 'agotada' : (libres <= pocasSillas ? 'pocas' : 'libres')}">
          <span class="funcion-hora" th:text="${#temporals.format(f.fechaHoraInicio, 'HH:mm')}">18:00</span>
          <span class="funcion-sala" th:text="${f.sala.nombre}">Sala 1</span>
          <span class="precio funcion-precio" th:text="${'$' + #numbers.formatDecimal(f.precio, 1, 'POINT', 0, 'COMMA')}">$12.000</span>
          <span class="funcion-libres">
            <span class="punto-disp" th:classappend="'disp-' + ${estado}" aria-hidden="true"></span>
            <span th:text="${libres <= 0 ? 'Sin sillas' : (libres == 1 ? '1 silla libre' : libres + ' sillas libres')}">40 sillas libres</span>
          </span>
          <span th:if="${libres <= 0}" class="btn btn-hora agotada" aria-disabled="true">Agotada</span>
          <a th:unless="${libres <= 0}" class="btn btn-hora"
             th:classappend="${libres <= pocasSillas} ? 'pocas'"
             th:href="@{/funciones/{id}/sillas(id=${f.id})}">Elegir sillas</a>
        </div>
      </th:block>
    </div>
  </section>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>

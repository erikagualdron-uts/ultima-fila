<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Registro')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>

<main class="container acceso">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

      <form class="card card-uf tarjeta-acceso" th:action="@{/registro}" th:object="${registroForm}" method="post" novalidate>
        <div class="tarjeta-marca" aria-hidden="true"><img th:src="@{/img/emblema-backrow-256.png}" src="/img/emblema-backrow-256.png" alt="" width="88" height="88"></div>
        <div class="p-4">
        <h1 class="titulo-acceso">Crear cuenta</h1>
        <p class="text-suave text-center">Regístrate como cliente para comprar tus boletas en línea.</p>

        <div class="mb-3">
          <label for="nombreCompleto" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}"
                 th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid'" maxlength="120" autocomplete="name">
          <div class="invalid-feedback" th:errors="*{nombreCompleto}"></div>
        </div>
        <div class="mb-3">
          <label for="documento" class="form-label">Documento</label>
          <input type="text" class="form-control" id="documento" th:field="*{documento}"
                 th:classappend="${#fields.hasErrors('documento')} ? 'is-invalid'" maxlength="20">
          <div class="invalid-feedback" th:errors="*{documento}"></div>
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input type="email" class="form-control" id="correo" th:field="*{correo}"
                 th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'" maxlength="120" autocomplete="email">
          <div class="invalid-feedback" th:errors="*{correo}"></div>
        </div>
        <div class="mb-3">
          <label for="clave" class="form-label">Clave</label>
          <div class="input-group has-validation">
            <input type="password" class="form-control" id="clave" th:field="*{clave}"
                   th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid'" maxlength="100"
                   autocomplete="new-password" aria-describedby="ayudaClave">
            <button type="button" class="btn btn-outline-uf" data-mostrar-clave="clave"
                    aria-controls="clave" aria-pressed="false">Mostrar</button>
            <div class="invalid-feedback" th:errors="*{clave}"></div>
          </div>
          <div class="form-text" id="ayudaClave">Mínimo 8 caracteres.</div>
        </div>
        <button type="submit" class="btn btn-uf w-100">Registrarme</button>
        <p class="mb-0 mt-3 small text-suave text-center">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
        </div>
      </form>
    </div>
  </div>
</main>

<footer th:replace="~{fragmentos/layout :: footer}"></footer>
<div th:replace="~{fragmentos/layout :: alertas}"></div>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
